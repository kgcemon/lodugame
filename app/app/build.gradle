plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludo3d.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ludo3d.game'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        // Default game server: the live site. Players can change it on the sign-in screen (Server settings).
        // For local testing (emulator -> `npm run dev` on this PC) use http://10.0.2.2:3001
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://freefirediamondtopup.com"'
    }

    buildTypes {
        release {
            // R8: strips unused code and resources and optimizes the rest (much smaller APK).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Splash screen (Android 12 style on every version).
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Google Play in-app purchases (gem packs).
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation('io.socket:socket.io-client:2.1.2') {
        // Use the org.json that ships with Android.
        exclude group: 'org.json', module: 'json'
    }
}
