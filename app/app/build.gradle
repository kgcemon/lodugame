plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludo3d.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ludo3d.game'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        // Default game server: the live site. Players can change it on the sign-in screen (Server settings).
        // For local testing (emulator -> `npm run dev` on this PC) use http://10.0.2.2:3001
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://freefirediamondtopup.com"'
        // Google Sign-In: the *Web* OAuth client id from Google Cloud Console (the server checks
        // tokens against it; set the same id in the server's GOOGLE_CLIENT_IDS).
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"308840747387-4ggm50ac5en3eh94f6ir33382o5bolb0.apps.googleusercontent.com"'
    }

    buildTypes {
        debug {
            // A debug build may use a plain-http test server on your PC (npm run dev).
            manifestPlaceholders = [cleartext: 'true']
        }
        release {
            // Players' builds talk to the server over HTTPS only.
            manifestPlaceholders = [cleartext: 'false']
            // R8: strips unused code and resources and optimizes the rest (much smaller APK).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Sign in with Google through Credential Manager.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Splash screen (Android 12 style on every version).
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Google Play in-app purchases (gem packs).
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation('io.socket:socket.io-client:2.1.2') {
        // Use the org.json that ships with Android.
        exclude group: 'org.json', module: 'json'
    }
}
